<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retr0Sec</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Consolas,monospace;
background:#000;
color:#00ff66;
overflow:hidden;
}

/* MATRIX */

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
}

/* Scanlines */

body::after{
content:"";
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:
linear-gradient(
transparent 50%,
rgba(0,255,0,.04) 50%);
background-size:100% 4px;
pointer-events:none;
z-index:999;
}

/* Glow */

.container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
flex-direction:column;
padding:20px;
}

.logo{

font-size:70px;
font-weight:bold;
letter-spacing:8px;

text-shadow:
0 0 10px #00ff66,
0 0 20px #00ff66,
0 0 40px #00ff66;
}

.subtitle{

margin-top:15px;
font-size:22px;
opacity:.8;
}

.line{

margin-top:40px;
font-size:18px;
color:#7dff9d;
min-height:30px;
}

button{

margin-top:40px;

background:transparent;
border:2px solid #00ff66;
padding:15px 40px;
color:#00ff66;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{

background:#00ff66;
color:#000;
box-shadow:0 0 20px #00ff66;
transform:scale(1.05);

}

/* Flicker */

.logo,.subtitle,.line{

animation:flicker 3s infinite;

}

@keyframes flicker{

0%{opacity:1;}
2%{opacity:.7;}
4%{opacity:1;}
8%{opacity:.5;}
10%{opacity:1;}
100%{opacity:1;}

}

/* Responsive */

@media(max-width:700px){

.logo{
font-size:42px;
letter-spacing:4px;
}

.subtitle{
font-size:18px;
}

.line{
font-size:15px;
}

}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">

<div class="logo">
RETR0SEC
</div>

<div class="subtitle">
Cyber Security • Pentesting • Ethical Hacking
</div>

<div class="line" id="typing"></div>

<button onclick="location.reload()">
INITIALIZE
</button>

</div>

<script>

/* TYPEWRITER */

const text="> Access Granted...\n> Initializing Retr0Sec Framework...\n> Welcome, Operator.";

let i=0;

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=
text.charAt(i)=="\n"?"<br>":text.charAt(i);

i++;

setTimeout(type,40);

}

}

type();

/* MATRIX */

const canvas=document.getElementById("matrix");

const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

const fontSize=16;

const columns=canvas.width/fontSize;

const drops=[];

for(let x=0;x<columns;x++){

drops[x]=1;

}

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ff66";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

const text=letters.charAt(Math.floor(Math.random()*letters.length));

ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975){

drops[i]=0;

}

drops[i]++;

}

}

setInterval(draw,35);

window.onresize=()=>{

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

</script>

</body>
</html>
